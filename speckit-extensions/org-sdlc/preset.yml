schema_version: "1.0"
preset:
  id: org-sdlc
  name: Organization SDLC Standards
  version: "1.0.0"
  description: Wraps clarify, plan, tasks and implement so the sdlc-skills extension runs its skill bindings at each stage.
  license: MIT
requires:
  speckit_version: ">=1.2.0,<2.0.0"
  extensions:
    - id: sdlc-skills
      version: ">=1.0.0,<2.0.0"
      required: true
provides:
  templates:
    - { type: command, name: speckit.clarify,   file: commands/speckit.clarify.md,   strategy: wrap }
    - { type: command, name: speckit.plan,      file: commands/speckit.plan.md,      strategy: wrap }
    - { type: command, name: speckit.tasks,     file: commands/speckit.tasks.md,     strategy: wrap }
    - { type: command, name: speckit.implement, file: commands/speckit.implement.md, strategy: wrap }
tags:
  - sdlc
  - skills
