schema_version: "1.0"
extension:
  id: sdlc-skills
  name: SDLC Skill Bindings
  version: "1.0.0"
  description: Runs vendored, version-pinned skills at Spec Kit stages through a binding registry.
  license: MIT
requires:
  speckit_version: ">=1.2.0,<2.0.0"
provides:
  commands:
    - name: speckit.sdlc-skills.run
      file: commands/speckit.sdlc-skills.run.md
      description: Apply the skill bindings for a stage
    - name: speckit.sdlc-skills.edge-case-audit
      file: commands/speckit.sdlc-skills.edge-case-audit.md
      description: Check every edge-case lens is answered or marked N/A
    - name: speckit.sdlc-skills.vuln-intake
      file: commands/speckit.sdlc-skills.vuln-intake.md
      description: Ask for flow, Agility ticket, branch and base branch, then read the vulnerability report
    - name: speckit.sdlc-skills.vuln-pr
      file: commands/speckit.sdlc-skills.vuln-pr.md
      description: Raise one PR per changed repo when every build passed
  config:
    - name: sdlc-skills-config.yml
      template: config/sdlc-skills-config.template.yml
      description: Binding registry and settings
      required: true
hooks:
  after_clarify:
    command: speckit.sdlc-skills.edge-case-audit
    optional: true
    prompt: Audit edge-case coverage?
    description: Edge-case coverage check
  after_implement:
    command: speckit.sdlc-skills.vuln-pr
    optional: false
    description: Raise vulnerability-upgrade PRs after a green build; skips when the feature has no vuln/intake.json
tags:
  - skills
  - clarify
  - plan
  - testing
  - security
  - gradle
