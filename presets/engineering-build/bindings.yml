schema_version: "1.0"
# Binding registry (shipped defaults). Override per repo in .specify/engineering-build.yml (project) or
# .specify/engineering-build.local.yml (local), matching bindings by id.
defaults:
  required: false        # false = warn and continue; true = block the stage
bindings:
  - id: clarify-grill
    stage: clarify
    skill: grill-me
    enabled: true
    locked: false
    trigger: { type: always }
    settings:
      interaction: rounds        # rounds | one-at-a-time
      max_rounds: 6
      split_threshold: 40
      edge_case_lenses:
        - empty and null input
        - boundary values
        - permissions and roles
        - concurrency and ordering
        - partial failure and retries
        - idempotency
        - timeouts
        - data volume
        - backfill and migration
        - rollback
        - observability
        - accessibility
        - localization
  - id: plan-db
    stage: plan
    order: 10
    skill: database-schema-designer
    enabled: true
    locked: false
    trigger: { type: detect, detector: db_change, ask_if_unknown: true }
  - id: plan-api
    stage: plan
    order: 20
    skill: api-designer
    depends_on: [plan-db]
    enabled: true
    locked: false
    trigger: { type: detect, detector: api_change, ask_if_unknown: true }
  - id: tasks-e2e
    stage: tasks
    skill: playwright-expert
    enabled: true
    locked: false
    trigger: { type: detect, detector: ui_flows }
  - id: impl-minimal
    stage: implement
    order: 10
    skill: ponytail
    enabled: true
    locked: false
    trigger: { type: always }
    settings:
      level: full              # lite | full | ultra
  - id: impl-e2e
    stage: implement.e2e-test
    skill: playwright-expert
    enabled: true
    locked: false
    trigger:
      type: any
      of:
        - { type: task_tag, tag: E2E }
        - { type: path_glob, globs: ["e2e/**/*.spec.ts", "tests/e2e/**/*.spec.ts"] }
  # Example of a future binding; not shipped in v1
  # - id: impl-unit
  #   stage: implement.unit-test
  #   skill: <unit-test-skill>
  #   trigger: { type: task_tag, tag: UT }
